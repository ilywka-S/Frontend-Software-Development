<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Зворотній зв'язок</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-feedback">
    <header>
        <div class="logo">
            <img src="images/icon.png" alt="logo">
            <h1>Онлайн-консультації "WealthAdvisor"</h1>
        </div>
        
        <nav>
            <a href="/index.html" class="nav-link">Головна</a>
            <a href="/services.html" class="nav-link">Послуги</a>
        </nav>
    </header>

    <a href="/index.html"><button>На головну</button></a>

    <form class="feedback-form">
        <fieldset class="personal-info">
            <legend>Персональна інформація</legend>
            <input type="text" placeholder="Прізвище та ім'я">
            <input type="email" placeholder="E-mail">
            <input type="number" placeholder="Вік">
        </fieldset>
        
        <div class="purpose-group">
            <label for="feedback-purpose">Мета звернення</label>
            <select id="feedback-purpose">
                <option value="cooperation">Співпраця</option>
                <option value="complaint">Скарга на якість послуги</option>
                <option value="offer">Пропозиція</option>
                <option value="errors">Наявність помилок на сайті</option>
                <option value="other">Інше</option>
            </select>
        </div>

        <div class="details">
            <label>Детально</label>
            <textarea placeholder="Опишіть детальніше свою проблему/побажання (макс 300 символів)" maxlength="300"></textarea>
        </div>
        
        <div class="personal-information-agreement">
            <input type="checkbox" id="agreement" required>
            <label for="agreement">Даю згоду на обробку персональної інформації</label>
        </div>
        
        <div class="send-feedback">
            <button type="submit">Надіслати</button>
        </div>
    </form>

    <script src="js/script.js"></script>
</body>
</html>
